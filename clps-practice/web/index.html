<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLPS Lunar Mission Browser (practice MVP)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#0b0e14;color:#e6e6e6;display:flex;flex-direction:column;height:100vh}
header{padding:6px 10px;background:#141a24;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
header h1{font-size:15px;margin:0 8px 0 0}select,button{background:#222b3a;color:#eee;border:1px solid #3a4660;border-radius:8px;padding:6px 10px;font-size:14px;min-height:40px;max-width:100%}html,body{overflow-x:hidden}
#banner{display:none;background:#b8860b;color:#000;font-weight:700;text-align:center;padding:4px}
main{flex:1;display:flex;min-height:0}#map{flex:1;background:#000}
#panel{width:420px;flex:none;overflow:auto;padding:10px;background:#111722;display:none}
.card{margin-bottom:12px}.card h2{font-size:16px;margin:0 0 4px}.k{color:#9aa}.win{font-size:12px}
#cmp{display:none;gap:8px}#cmp.on{display:flex}#cmp>div{flex:1;min-width:0}
.legend{background:#141a24cc;padding:6px;border-radius:6px;line-height:1.5}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
body.cmp #panel{width:min(60vw,900px)}
#polar{position:absolute;right:8px;bottom:22px;width:180px;height:180px;z-index:500;border:1px solid #556;border-radius:50%;background:#1b1f27;overflow:hidden;display:none}
body.pole #polar{display:block}body.pole.big #polar{left:0;top:0;right:0;bottom:0;width:auto;height:auto;border-radius:0;z-index:1100;background:#141922}
#pclose{display:none;position:absolute;top:8px;right:8px;z-index:1200;width:44px;height:44px;font-size:20px}body.pole.big #pclose{display:block}@media(max-width:900px),(orientation:portrait) and (max-width:1100px){body.pole.big #polar{position:fixed}body.pole.big #pclose,body.pole.big #ptitle{position:fixed}}
#ptitle{display:none;position:absolute;top:14px;left:12px;z-index:1200;font-size:15px;font-weight:600;pointer-events:none}body.pole.big #ptitle{display:block}
.rl{color:#99a;font-size:12px;white-space:nowrap}body.pole:not(.big) .rl{font-size:10px}
#panel{display:block}.intro h2{font-size:17px;margin:0 0 6px}.intro p{margin:4px 0;color:#bbc}.cnt{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.cnt span{padding:4px 8px;border-radius:12px;background:#1d2533;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid #222b3a;text-align:left}.tbl tr.r{cursor:pointer}.tbl tr.r:hover{background:#1a2230}.back{display:inline-block;margin-bottom:8px;color:#7af;cursor:pointer;min-height:32px}
.legend{font-size:13px}.legend.min .items{display:none}.legend summary{cursor:pointer;min-height:32px}
.leaflet-control-layers label{min-height:36px;display:flex;align-items:center;font-size:14px}.leaflet-touch .leaflet-bar a{width:40px;height:40px;line-height:40px}
canvas{max-width:100%}.chartbox{position:relative;height:clamp(180px,28vh,280px)}
@media(max-width:900px),(orientation:portrait) and (max-width:1100px){main{flex-direction:column}#map{flex:1 1 50%;min-height:260px}#panel,body.cmp #panel{width:100%;flex:1 1 50%}}
@media(max-width:600px){#cmp.on{flex-direction:column}header{gap:4px}header h1{width:100%;font-size:14px}header h1 small,header select{flex:1 1 45%;min-width:0}header button{flex:1 1 45%}.tbl .pv{display:none}}
body.cmp.pole:not(.big) #polar{display:none}@media(min-width:1024px){body.pole:not(.big) #polar{width:150px;height:150px}}

</style></head><body>
<header><h1>🌙 CLPS Browser <small style="color:#888">practice</small> <a href="../v2/" style="font-size:.55em;color:#f0a83a;margin-left:8px">Try the new 3D South Pole view →</a></h1>
<select id="fs"><option value="">All status</option></select><select id="fp"><option value="">All providers</option></select>
<button id="cbtn">Compare: off</button><button id="pbtn">South pole</button></header>
<div id="banner">MOCK DATA — fake sites for layout only (real data/*.json not found)</div>
<main><div id="map" style="position:relative"><div id="polar"></div><button id="pclose" aria-label="Close south pole view">✕</button><div id="ptitle">South pole · polar view (lat ≤ −75°)</div></div><div id="panel"><div id="one"></div><div id="cmp"><div id="c0"></div><div id="c1"></div></div></div></main>
<script>
const COL={landed:'#2ecc71',partial:'#f1c40f',failed:'#e74c3c',planned:'#3498db'};
let S=[],T={},markers=[],cmp=false,picked=[],charts={};
async function j(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
async function load(){try{S=await j('../data/sites.json');try{T=await j('../data/timeline.json')}catch(e){T={}}}
catch(e){S=await j('mock/sites.json');T=await j('mock/timeline.json');banner.style.display='block'}}
const MB=L.latLngBounds([[-85.05,-180],[85.05,180]]);const map=L.map('map',{zoomSnap:0,zoomDelta:0.5,maxZoom:7,maxBounds:MB,maxBoundsViscosity:1,attributionControl:true}).setView([0,0],1);
function cover(){const z=map.getBoundsZoom(MB,true);const sz=map.getSize();const zc=Math.log2(Math.max(sz.x,sz.y)/256);map.setMinZoom(zc);if(map.getZoom()<zc+0.01||!cover.done){map.setView([0,0],zc,{animate:false});cover.done=1}}
new ResizeObserver(()=>{map.invalidateSize();cover()}).observe(document.getElementById('map'));
L.tileLayer('https://cartocdn-gusc.global.ssl.fastly.net/opmbuilder/api/v1/map/named/opm-moon-basemap-v0-1/all/{z}/{x}/{y}.png',{maxNativeZoom:2,noWrap:true,crossOrigin:true,attribution:''}).addTo(map);
const opm=L.tileLayer('https://cartocdn-gusc.global.ssl.fastly.net/opmbuilder/api/v1/map/named/opm-moon-basemap-v0-1/all/{z}/{x}/{y}.png',{crossOrigin:true,maxNativeZoom:7,attribution:'OpenPlanetary / LROC (NASA/GSFC/ASU)',noWrap:true});
const cv=document.createElement('canvas');cv.width=cv.height=32;const cx=cv.getContext('2d',{willReadFrequently:true});cx.imageSmoothingEnabled=false;
opm.on('tileload',e=>{try{cx.drawImage(e.tile,0,0,32,32);const d=cx.getImageData(0,0,32,32).data;const h={};let top=0;for(let i=0;i<d.length;i+=4){const v=d[i];h[v]=(h[v]||0)+1;top=Math.max(top,h[v])}if(top>0.8*1024)e.tile.style.visibility='hidden'}catch(_){}});
let tileErr=0;opm.on('tileerror',()=>{if(++tileErr==4){map.removeLayer(opm);L.imageOverlay('https://upload.wikimedia.org/wikipedia/commons/d/db/Moonmap_from_clementine_data.png',[[-85,-180],[85,180]]).addTo(map)}}).addTo(map);
const lg=L.control({position:'bottomleft'});lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<details '+(innerWidth>=1400&&innerHeight>=850?'open':'')+'><summary>Legend</summary><span style="color:#f6f">dashed = approx</span><br>'+Object.entries({...COL,cancelled:'#777'}).map(([k,c])=>`<span class=dot style=background:${c}></span>${k}`).join('<br>')+'</details>';L.DomEvent.disableClickPropagation(d);return d};lg.addTo(map);
function draw(){markers.forEach(m=>map.removeLayer(m));markers=[];const s=fs.value,p=fp.value;
 S.filter(x=>x.lat!=null&&x.lon!=null).filter(x=>(!s||(s=='cancelled'?x.cancelled:x.status==s&&!x.cancelled))&&(!p||x.provider==p)).forEach(x=>{const m=L.circleMarker([x.lat,x.lon],{radius:9,color:x.uncertain?'#ff66ff':'#fff',weight:x.uncertain?2.5:1.5,dashArray:x.uncertain?'3 3':null,fillColor:x.cancelled?'#777':(COL[x.status]||'#aaa'),fillOpacity:x.uncertain?.55:.95}).addTo(map).bindTooltip(x.mission+(x.uncertain?' (approx. location)':''));m.on('click',()=>pick(x));markers.push(m)})}
function card(x,el,key){const t=T[x.id];const sm=t?.summary;
 el.innerHTML=`<div class=card><h2>${x.mission}</h2><div><span class=k>Provider</span> ${x.provider} · <span class=k>Lander</span> ${x.lander}</div>
 <div><span class=k>Site</span> ${x.lat==null?'unknown':x.lat.toFixed(2)+'°, '+x.lon.toFixed(2)+'°'} · <span class=k>Date</span> ${x.date} · <b style="color:${x.cancelled?'#aaa':COL[x.status]}">${x.cancelled?'Cancelled':x.status}</b>${x.uncertain?' <span style=color:#f6f>⚠ coords/date approximate</span>':''}${x.non_clps?' <span class=k>(non-CLPS)</span>':''}</div>${x.note?`<div class=k style=font-size:12px>${x.note}</div>`:''}
 <div><span class=k>Payloads</span> ${(x.payloads||[]).join(', ')}</div>${x.source&&x.source.startsWith('http')?`<div><a style=color:#7af href="${x.source}" target=_blank>source</a></div>`:''}
 ${t?`<div style="margin-top:6px;font-size:12px" class=k>Over 60 days from ${t.start.slice(0,10)} UTC${sm.start_from&&sm.start_from.startsWith('default')?' <b style=color:#f6f>⚠ default window (no exact landing date)</b>':' (landing date)'}</div><div><span class=k>Lit</span> ${sm.pct_lit}% · <span class=k>Earth visible</span> ${sm.pct_earth}%${sm.pct_lit_and_earth!=null?` · <span class=k>Both</span> ${sm.pct_lit_and_earth}%`:''}${sm.pct_lit_terrain!=null?` · <span class=k>Lit with terrain (prototype)</span> ${sm.pct_lit_terrain}%`:''}${sm.longest_night_hours!=null?` · <span class=k>Longest night</span> ${Math.round(sm.longest_night_hours)} h`:''}${sm.pct_earth==0?`<div style=color:#f88>Far side: no direct link to Earth — needs a relay satellite, so no comms windows.</div>`:''}${sm.longest_night!=null?` · <span class=k>Longest night</span> ${typeof sm.longest_night=='object'?JSON.stringify(sm.longest_night):sm.longest_night}`:''}</div><div class=chartbox><canvas id="cv-${key}"></canvas></div>
 <div class=win><b>Best windows</b> <span class=k>(demo window score 0–1 = sunlight × Earth-visible × daylight left; not a probability)</span><br>${(sm.best_windows||[]).map(w=>`${w.start.slice(0,16).replace('T',' ')} → ${w.end.slice(0,16).replace('T',' ')} UTC · demo window score ${(+w.score).toFixed(2)}`).join('<br>')||(sm.pct_earth==0?'none (no direct-to-Earth)':'none')}</div>`:'<i>No timeline yet</i>'}</div>`;
 if(!t)return;charts[key]?.destroy();const YMAX=Math.max(5,...t.samples.map(s=>Math.max(s.sun_elev_deg,s.earth_elev_deg)))+2;const hasT=t.samples.some(s=>s.lit_terrain!=null);const L_=t.samples.map(s=>s.t.slice(5,13).replace('T',' '));
 const band=(f,c)=>({type:'bar',data:t.samples.map(s=>s[f]?YMAX:null),backgroundColor:c,barPercentage:1,categoryPercentage:1,yAxisID:'y',order:3,label:f=='lit'?'lit':'Earth visible'});
 charts[key]=new Chart(document.getElementById('cv-'+key),{data:{labels:L_,datasets:[
  {type:'line',label:'Sun elev°',data:t.samples.map(s=>s.sun_elev_deg),borderColor:'#f5b041',pointRadius:0,borderWidth:2,order:1},
  {type:'line',label:'Earth elev°',data:t.samples.map(s=>s.earth_elev_deg),borderColor:'#5dade2',pointRadius:0,borderWidth:2,order:1},
  band('lit','rgba(245,176,65,.10)'),...(hasT?[{type:'line',label:'lit w/ terrain (prototype)',data:t.samples.map(s=>s.lit_terrain?0:null),borderColor:'#e67e22',borderWidth:5,pointRadius:0,spanGaps:false,order:0}]:[]),band('earth_visible','rgba(93,173,226,.10)')]},
  options:{maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:'#ccc',boxWidth:10,font:{size:10}}}},scales:{x:{ticks:{color:'#888',maxTicksLimit:6},title:{display:true,text:'UTC',color:'#888'}},y:{suggestedMin:Math.min(-5,...t.samples.map(s=>Math.min(s.sun_elev_deg,s.earth_elev_deg)))-2,suggestedMax:Math.max(5,...t.samples.map(s=>Math.max(s.sun_elev_deg,s.earth_elev_deg)))+2,ticks:{color:'#888'},title:{display:true,text:'elevation ° (smooth sphere)',color:'#888'}}}}})}
function intro(){const c={};S.forEach(x=>{const k=x.cancelled?'cancelled':x.status;c[k]=(c[k]||0)+1});
 const rows=[...S].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>`<tr class=r data-id="${x.id}"><td><span class=dot style="background:${x.cancelled?'#777':COL[x.status]}"></span>${x.mission}</td><td class=pv>${x.provider}</td><td>${x.date}</td><td>${x.cancelled?'Cancelled':x.status}</td></tr>`).join('');
 one.innerHTML=`<div class=intro><h2>CLPS Lunar Mission Browser</h2><p>NASA's Commercial Lunar Payload Services missions: where they landed (or will), and when each site has sunlight and a line of sight to Earth.</p>
 <p><b>How to use:</b> tap a marker or a row below for mission details and a 60-day sun/Earth timeline. <b>Compare</b> shows two sites side by side. <b>South pole</b> opens a polar view for sites near the pole. ✦ = Artemis III candidate regions.</p>
 <div class=cnt><span>${S.length} missions</span>${Object.entries(c).map(([k,v])=>`<span><span class=dot style="background:${k=='cancelled'?'#777':COL[k]}"></span>${v} ${k}</span>`).join('')}</div>
 <table class=tbl><tr><th>Mission</th><th class=pv>Provider</th><th>Date</th><th>Status</th></tr>${rows}</table><p class=k style="font-size:12px">Practice build. Times UTC. Sun/Earth geometry on a smooth sphere unless marked terrain.</p></div>`;
 one.querySelectorAll('tr.r').forEach(t=>t.onclick=()=>pick(S.find(x=>x.id==t.dataset.id)))}
function pick(x){panel.style.display='block';if(cmp){picked=[...picked.filter(p=>p!=x),x].slice(-2);one.innerHTML=picked.length<2?'<i>Tap a second site to compare</i>':'';picked.forEach((p,i)=>card(p,document.getElementById('c'+i),'c'+i))}else{card(x,one,'one');one.insertAdjacentHTML('afterbegin','<a class=back onclick="intro()">← All missions</a>')}panel.scrollTop=0;setTimeout(()=>map.invalidateSize(),50)}
function poleView(){const b=document.body;pbtn.textContent=b.classList.contains('big')?'Close pole':'South pole';const fit=()=>{PM.invalidateSize();if(b.classList.contains('big')){const s=PM.getSize();PM.fitBounds([[-11.5,-11.5],[11.5,11.5]],{padding:[40,40]})}else PM.fitBounds([[-16,-16],[16,16]])};setTimeout(fit,60)}
pclose.onclick=()=>{document.body.classList.remove('big');if(innerWidth<1024)document.body.classList.remove('pole');poleView()};
pbtn.onclick=()=>{const b=document.body;if(b.classList.contains('big')){pclose.onclick();return}b.classList.add('pole','big');poleView();};
cbtn.onclick=()=>{cmp=!cmp;document.body.classList.toggle('cmp',cmp);setTimeout(()=>map.invalidateSize(),60);cbtn.textContent='Compare: '+(cmp?'on':'off');document.getElementById('cmp').classList.toggle('on',cmp);if(cmp)one.innerHTML='<i>Tap two sites (map or polar view) to compare</i>';else intro();picked=[];c0.innerHTML=c1.innerHTML=''};
fs.onchange=fp.onchange=draw;
let AR=L.layerGroup();fetch('../data/artemis_regions.json').then(r=>r.ok?r.json():[]).then(a=>{a.forEach(r=>L.marker([r.lat,r.lon],{icon:L.divIcon({className:'',html:'<div style="color:#fff;font-size:16px;text-shadow:0 0 3px #000">✦</div>'})}).bindPopup(`<b>Artemis III candidate:</b> ${r.name}${r.uncertain?' (approx.)':''}<br>${r.lat.toFixed(2)}°, ${r.lon.toFixed(2)}°${r.source?`<br><a href="${r.source}" target=_blank>source</a>`:''}`).addTo(AR));if(a.length){AR.addTo(map);}if(a.length)L.control.layers(null,{'Artemis III ✦':AR},{collapsed:false}).addTo(map)}).catch(()=>{});
document.getElementById('polar').addEventListener('click',e=>{if(!document.body.classList.contains('big')&&!e.target.closest('path')){document.body.classList.add('big');poleView()}});const PM=L.map('polar',{crs:L.CRS.Simple,zoomControl:false,attributionControl:false,minZoom:-2,zoomSnap:0}).setView([0,0],2.6);
function ps(lat,lon){const r=(90+lat);const a=lon*Math.PI/180;return [r*Math.cos(a),r*Math.sin(a)]}
[5,10,15].forEach(r=>{L.circle([0,0],{radius:r,color:'#556',weight:1,fill:false,interactive:false}).addTo(PM);L.marker([-r,0],{interactive:false,icon:L.divIcon({className:'',html:`<div class=rl style='transform:translate(-50%,2px)'>${-90+r}°</div>`})}).addTo(PM)});
L.marker([0,0],{interactive:false,icon:L.divIcon({className:'',html:'<div class=rl style="transform:translate(-50%,-50%)">+ pole</div>'})}).addTo(PM);
function drawPolar(list,ar){list.filter(x=>x.lat!=null&&x.lat<=-75).forEach(x=>L.circleMarker(ps(x.lat,x.lon),{radius:6,color:x.uncertain?'#ff66ff':'#fff',dashArray:x.uncertain?'3 3':null,weight:1.5,fillColor:x.cancelled?'#777':COL[x.status],fillOpacity:.9}).addTo(PM).bindTooltip(x.mission+' '+x.lat.toFixed(2)+'°',{direction:'top'}).on('click',()=>pick(x)));
 (ar||[]).forEach(r=>L.marker(ps(r.lat,r.lon),{icon:L.divIcon({className:'',html:'<div style="color:#fff;font-size:11px">✦</div>'})}).addTo(PM).bindTooltip('Artemis III: '+r.name,{direction:'top'}))}
fetch('../data/artemis_regions.json').then(r=>r.ok?r.json():[]).catch(()=>[]).then(a=>window.ARD=a);
load().then(()=>{cover();intro();setTimeout(()=>drawPolar(S,window.ARD),300);if(innerWidth>=1024&&innerHeight>=700){document.body.classList.add('pole');poleView()}[...Object.keys(COL),'cancelled'].forEach(s=>fs.add(new Option(s,s)));[...new Set(S.map(x=>x.provider))].sort().forEach(p=>fp.add(new Option(p,p)));draw();window.READY=1;window.SITES=S});
</script></body></html>

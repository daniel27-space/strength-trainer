<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lunar Landing Site Navigator, practice</title>
<meta name="description" content="Pick a landing site near the Moon's south pole and see, with real LOLA terrain and JPL ephemeris, how often it gets sunlight and a view of Earth. A practice project, not mission data.">
<meta name="theme-color" content="#07080b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website"><meta property="og:title" content="Lunar Landing Site Navigator, practice">
<meta property="og:description" content="Find a lunar south-pole landing spot with sunlight and Earth in view. Terrain-aware sky charts, calendars and validation.">
<meta property="og:image" content="https://daniel27-space.github.io/strength-trainer/clps-practice/v3/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://daniel27-space.github.io/strength-trainer/clps-practice/v3/">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Lunar Landing Site Navigator, practice">
<meta name="twitter:description" content="Find a lunar south-pole landing spot with sunlight and Earth in view.">
<meta name="twitter:image" content="https://daniel27-space.github.io/strength-trainer/clps-practice/v3/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="scene" aria-label="3D map of the lunar south pole"></div>
<header id="top" class="glass">
  <div class="brand"><img src="favicon.svg" alt="" width="28" height="28"><div><b><span class="full">Lunar Landing </span>Site Navigator</b><span class="pchip">practice</span></div></div>
  <div class="seg" role="group" aria-label="Map view">
    <button data-view="pole" aria-pressed="true"><span class="sp">South </span>Pole</button><button data-view="globe" aria-pressed="false">Globe</button>
  </div>
  <div class="actions">
    <button id="tourBtn" class="accent" title="Start the 60-second guided tour" aria-label="Start tour"><span class="lbl"> Tour</span></button>
    <button id="shareBtn" title="Copy a link to this view" aria-label="Copy link"><span class="lbl"> Share</span></button>
  </div>
</header>
<aside id="panel" class="glass" data-snap="half">
  <div id="grab" aria-label="Drag to resize"><span></span></div>
  <nav class="tabs" role="tablist">
    <button data-tab="site" role="tab">Site</button><button data-tab="compare" role="tab">Compare</button><button data-tab="missions" role="tab">Missions</button><button data-tab="method" role="tab">Method</button>
  </nav>
  <div id="pbody">
    <section data-pane="site"></section>
    <section data-pane="compare"></section>
    <section data-pane="missions"></section>
    <section data-pane="method"></section>
  </div>
  <footer class="dataupd"></footer>
</aside>
<div id="maplegend" class="glass" hidden></div>
<div id="scrub" class="glass">
  <div class="srow">
    <button id="play" aria-label="Play"></button>
    <button id="speed" class="mono" aria-label="Playback speed">1 d/s</button>
    <div class="track"><svg id="bands" preserveAspectRatio="none" aria-hidden="true"></svg><input id="time" type="range" min="0" max="1000" step="1" aria-label="Time within the window"></div>
  </div>
  <div class="slabel"><span id="tlabel" class="mono"></span><span id="wlabel" class="mono"></span><span id="tnow"></span>
    <label class="layersel"><span class="lbl2">Heatmap</span><select id="layer" aria-label="Heatmap layer"><option value="none">No heatmap</option><option value="lit">% time lit</option><option value="earth">% Earth visible</option></select></label>
    <span id="heatlg" class="heatlg" hidden><span class="mono">0%</span><i></i><span class="mono">100%</span><small></small></span>
    <button id="keyBtn" class="keyb" aria-expanded="false" aria-controls="maplegend">Key</button></div>
</div>
<div id="caption" class="glass" hidden><div id="captext" aria-live="polite"></div><div class="capbar"><i></i></div><button id="tourStop">Stop tour</button></div>
<div id="toast" hidden role="status"></div>
<script type="module" src="app.js"></script>
</body></html>

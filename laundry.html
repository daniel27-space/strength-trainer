<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laundry Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laundry">
<meta name="theme-color" content="#0f1512">
<style>
:root{--bg:#0f1512;--card:#1a221d;--line:#26312a;--tx:#e8efe9;--mu:#8a9a8d;--acc:#5b8a62;--g:#6fbf7a;--a:#e0a93a;--b:#5aa9e6;--r:#d9534a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:calc(env(safe-area-inset-top) + 6px) 14px 96px;font-variant-numeric:tabular-nums}
h1{font-size:22px;margin:10px 2px 10px;font-weight:700}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:18px 4px 8px;font-weight:600}
.sum{border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;transition:background .3s}
.sum.r{background:#4a2321}.sum.a{background:#4a3a18}.sum.g{background:#22362a}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.pr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}.pr:first-child{border-top:0}
.pr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr .h{color:var(--mu);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;transition:background .3s}.dot.r{background:var(--r)}.dot.a{background:var(--a)}.dot.g{background:var(--acc)}
.row{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.row:first-child{border-top:0}.row:active{background:#222c25}
.row .nm{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:5px}
.chip{min-width:34px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:0 8px;transition:opacity .2s}
.chip.c{background:#1f3a26;color:var(--g)}.chip.d{background:#3d3018;color:var(--a)}.chip.w{background:#16304a;color:var(--b)}.chip.z{opacity:.28}
.legend{display:flex;justify-content:flex-end;gap:5px;padding:0 14px 6px;font-size:11px;color:var(--mu)}.legend span{min-width:34px;text-align:center}
.muted{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;min-height:46px;background:#26332a;color:var(--tx);cursor:pointer;transition:transform .12s,background .15s,opacity .15s}
button:active{transform:scale(.95)}button:disabled{opacity:.3}
button.p{background:var(--acc);color:#fff;font-weight:600}button.dg{background:#4a2321;color:#ffb3ad}button.gh{background:transparent;color:var(--mu)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.bar button{flex:1;font-size:16px}.bar button.p{flex:2}
a{color:#9fb8a3}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,10px);background:#2f4a36;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* sheet */
.bd{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.bd.on{opacity:.55;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:#18201b;border-radius:20px 20px 0 0;padding:8px 18px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:30;max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:#3a473e;margin:0 auto 10px}
.sheet h3{margin:0 0 2px;font-size:20px;text-align:center}.sheet .sub{text-align:center;margin-bottom:10px}
.st{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.sub+.st{border-top:0}
.st .lb{flex:1;font-size:16px;display:flex;align-items:center;gap:8px}
.st .lb i{width:10px;height:10px;border-radius:50%}
.rb{width:46px;height:46px;min-height:0;border-radius:50%;padding:0;font-size:24px;line-height:1;background:#26332a}
.st .v{width:52px;text-align:center;font-size:28px;font-weight:700}
.qa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 10px}.qa button{font-size:14px;padding:10px 4px}
.full{width:100%}
.srow{display:grid;grid-template-columns:28px 1fr 46px 46px 46px 34px;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.srow.hd{border-top:0;font-size:11px;color:var(--mu);text-align:center;padding:0 0 4px}
.srow input{font:inherit;font-size:15px;width:100%;min-width:0;padding:8px 4px;border-radius:9px;border:1px solid #2f3c33;background:#111813;color:#fff;text-align:center;height:38px}
.srow input.n{text-align:left;padding:8px}
.arw{display:flex;flex-direction:column;gap:2px}.arw button,.srow .x{min-height:0;height:18px;padding:0;font-size:11px;border-radius:5px;background:#222c25}
.srow .x{height:34px;font-size:14px;background:transparent;color:#d9837c}
.gh2{display:flex;align-items:center;gap:6px;margin:18px 4px 7px;cursor:pointer;user-select:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600}
.gh2 .cv{display:inline-block;transition:transform .2s;font-size:10px}.gh2.cl .cv{transform:rotate(-90deg)}
.gh2 .gs{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;font-weight:600}.gs.d{color:var(--a)}.gs.w{color:var(--b)}.gs.ok{color:var(--mu);opacity:.6}
.gh2.cl+.card,.gh2.cl+.gbody{display:none}
.sheet .gh2{margin:14px 0 4px}
.sheet .card{background:#1f2822;padding:0 12px}.sheet .card .st:first-child{border-top:0}
.wfoot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:#18201b;margin:0 -18px;padding:10px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 12px #18201b}
.sgh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600;margin:14px 0 2px}

.srow select{grid-column:2/6;font:inherit;font-size:13px;height:32px;border-radius:9px;border:1px solid #2f3c33;background:#111813;color:var(--mu);padding:0 6px}
.scard{background:#1f2822;border-radius:12px;overflow:hidden}
.sr{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 6px 0 14px;border-top:1px solid var(--line)}.sr:first-child{border-top:0}
.sn{flex:1;min-width:0;font:inherit;font-size:16px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--tx);padding:6px 6px;margin-left:-6px}
.sn:focus{outline:0;border-color:#3a4a3f;background:#111813}
.ms{display:flex;align-items:center;background:#26332a;border-radius:9px;height:32px}.ms button{min-height:0;height:32px;width:32px;padding:0;background:transparent;font-size:18px;border-radius:9px}.ms b{min-width:22px;text-align:center;font-size:15px}
.ic.dx{width:auto;color:#ff8a80;font-size:13px;padding:0 6px}.ic[aria-label=delete]{font-size:15px;opacity:.55}.ic.dx{opacity:1}
.ic{min-height:0;width:34px;height:34px;padding:0;background:transparent;color:var(--mu);font-size:20px}
.mn{display:flex;flex-direction:column;background:#151c17;border-top:1px solid var(--line)}.mn button{min-height:0;background:transparent;text-align:left;padding:11px 18px;border-radius:0;font-size:15px;border-top:1px solid #1f2822}.mn button:first-child{border-top:0}.mn .del{color:#ff8a80}
.sadd{display:block;width:100%;min-height:0;text-align:left;background:transparent;color:var(--g);padding:13px 14px;border-top:1px solid var(--line);border-radius:0;font-size:15px}.scard>.sadd:first-child{border-top:0}
</style></head><body>
<h1>Laundry</h1>
<div id="sum" class="sum"></div>
<h2>Wash next</h2><div id="prio" class="card"></div>
<h2>Items</h2>
<div class="legend"><span>clean</span><span>dirty</span><span>drying</span></div>
<div id="items"></div>
<p class="muted" style="text-align:center;margin-top:18px"><a href="./index.html">← Strength tracker</a> · saved on this phone only</p>
<div class="bar"><button class="p" onclick="openWash()">🧺 Washed</button><button onclick="openSet()">⚙️ Settings</button></div>

<div id="bd" class="bd" onclick="closeSheet()"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast"></div>
<script>
const K='laundry-v1';
const DEF=[["PT shorts",4,1,1],["PT shirt",4,1,1],["PT pants",2,0.5,0],["Admin shirt",3,0.5,1],["Admin pants",3,0.5,1],["Admin socks",4,0.5,1],["Boot socks",5,1,1],["No.4 top",3,0.5,1],["No.4 pants",3,0.5,1],["Towel",2,0.5,0],["Underwear",7,1,1]];
const GR=['PT kit','Admin','No.4','Socks & underwear','Towels','Other'];
function guessG(n){n=String(n).toLowerCase().trim();
 if(/sock|underwear/.test(n))return'Socks & underwear';
 if(['pt shorts','pt shirt','pt pants'].includes(n))return'PT kit';
 if(['admin shirt','admin pants'].includes(n))return'Admin';
 if(['no.4 top','no.4 pants','army uniform','army pants'].includes(n))return'No.4';
 if(n==='towel'||n==='towels')return'Towels';return'Other'}
function grouped(list){return GR.map(g=>[g,list.filter(x=>(x.group||'Other')===g)]).filter(x=>x[1].length)}
const CK='laundry-v1-collapsed';let COL={};try{COL=JSON.parse(localStorage.getItem(CK))||{}}catch(e){}
function tog(k){COL[k]=!COL[k];localStorage.setItem(CK,JSON.stringify(COL));buzz();const e=document.querySelector(`[data-ck="${CSS.escape(k)}"]`);e&&e.classList.toggle('cl',!!COL[k])}
function ghead(k,g,sum){return `<div class="gh2${COL[k]?' cl':''}" data-ck="${esc(k)}" onclick="tog(this.dataset.ck)" role="button"><span class="cv">▼</span>${esc(g)}${sum}</div>`}
let S=load();
function mk(a){return{id:Math.random().toString(36).slice(2,8),name:a[0],qty:a[1],need:a[2],buf:a[3],clean:a[1],dirty:0,dry:0,group:guessG(a[0])}}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.items){if(!s.uw){if(!s.items.some(i=>/underwear/i.test(i.name)))s.items.push(mk(["Underwear",7,1,1]));s.uw=1}let ch=0;s.items.forEach(i=>{if(!i.group||!GR.includes(i.group)){i.group=guessG(i.name);ch=1}});if(ch)localStorage.setItem(K,JSON.stringify(s));return s}}catch(e){}return{items:DEF.map(mk),uw:1}}
function save(){localStorage.setItem(K,JSON.stringify(S))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1500)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function info(i){const q=i.qty||0,c=i.clean;
 const lvl=q===0?'g':(c===0||(q>=3&&c<=1))?'r':c<=q/3?'a':'g';
 return{lvl,rank:{r:0,a:1,g:2}[lvl],ratio:q?c/q:1}}
function hint(i,f){return f.lvl==='r'?(i.dirty?'wash now':i.dry?'dry them':'low'):'wash soon'}
function get(id){return S.items.find(x=>x.id===id)}
function render(){
 const L=S.items.map(i=>({i,f:info(i)})).sort((a,b)=>a.f.rank-b.f.rank||a.f.ratio-b.f.ratio);
 const att=L.filter(x=>x.f.lvl!=='g').slice(0,3);
 document.getElementById('prio').innerHTML=att.length?att.map(({i,f})=>`<div class="pr"><span class="dot ${f.lvl}"></span><span class="t"><b>${esc(i.name)}</b><span class="h">: ${i.clean} of ${i.qty} clean · ${i.dirty} dirty · ${hint(i,f)}</span></span></div>`).join(''):'<div class="pr"><span class="dot g"></span><span class="t">All good</span></div>';
 const w=att[0],sm=document.getElementById('sum');let t,c;
 if(!S.items.length){c='g';t='Add items in settings'}
 else if(!w){c='g';t='All good'}
 else{c=w.f.lvl;t=`Wash ${w.i.name.toLowerCase()} next`}
 sm.className='sum '+c;sm.innerHTML=`<span class="dot ${c}"></span><span>${esc(t)}</span>`;
 const ch=(v,k)=>`<span class="chip ${k}${v?'':' z'}">${v}</span>`;
 // fixed stored order: never sorted
 const gsum=a=>{const d=a.reduce((s,i)=>s+i.dirty,0),w=a.reduce((s,i)=>s+i.dry,0);return `<span class="gs ${d?'d':w?'w':'ok'}">${d?d+' dirty':w?w+' drying':'all clean'}</span>`};
 document.getElementById('items').innerHTML=grouped(S.items).map(([g,a])=>ghead('m:'+g,g,gsum(a))+'<div class="card">'+a.map(i=>`<div class="row" data-id="${i.id}" onclick="openItem('${i.id}')"><span class="dot ${info(i).lvl}"></span><span class="nm">${esc(i.name)}</span><span class="chips">${ch(i.clean,'c')}${ch(i.dirty,'d')}${ch(i.dry,'w')}</span></div>`).join('')+'</div>').join('')||'<div class="card"><div class="pr muted">No items. Add some in Settings.</div></div>';
}
/* sheet plumbing */
const sh=document.getElementById('sheet'),bd=document.getElementById('bd');let onClose=null;
function openSheet(html,cb){sh.innerHTML='<div class="grab"></div>'+html;onClose=cb||null;sh.scrollTop=0;requestAnimationFrame(()=>{bd.classList.add('on');sh.classList.add('on')})}
function closeSheet(){bd.classList.remove('on');sh.classList.remove('on');const f=onClose;onClose=null;f&&f()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sh.classList.contains('on'))closeSheet()});
const LB={clean:['Clean','var(--g)'],dirty:['Dirty','var(--a)'],dry:['Drying','var(--b)']};
function stepper(k,v,fn,max){return `<div class="st"><span class="lb"><i style="background:${LB[k][1]}"></i>${LB[k][0]}</span><button class="rb" ${v<=0?'disabled':''} onclick="${fn}('${k}',-1)" aria-label="minus">−</button><span class="v" id="v-${k}">${v}</span><button class="rb" ${max!=null&&v>=max?'disabled':''} onclick="${fn}('${k}',1)" aria-label="plus">+</button></div>`}
/* item sheet */
let cur=null;
function openItem(id){cur=id;openSheet('<div id="ib"></div>',()=>{cur=null});drawItem()}
function drawItem(){const i=get(cur);if(!i)return;
 document.getElementById('ib').innerHTML=`<h3>${esc(i.name)}</h3><div class="sub muted">${i.qty} total</div>
 ${stepper('clean',i.clean,'stp')}${stepper('dirty',i.dirty,'stp')}${stepper('dry',i.dry,'stp')}
 <div class="qa"><button class="p" ${i.clean?'':'disabled'} onclick="act('wore')">👕 Wore one</button><button ${i.dirty?'':'disabled'} onclick="act('wash')">🧺 Wash all dirty</button><button ${i.dry?'':'disabled'} onclick="act('dry')">☀️ All dry</button></div>
 <button class="full" onclick="closeSheet()">Done</button>`}
function stp(k,d){const i=get(cur);i[k]=Math.max(0,i[k]+d);i.qty=i.clean+i.dirty+i.dry;buzz();save();render();drawItem()}
function act(a){const i=get(cur);
 if(a==='wore'&&i.clean){i.clean--;i.dirty++;toast(i.name+' → dirty')}
 if(a==='wash'&&i.dirty){i.dry+=i.dirty;i.dirty=0;toast(i.name+' → drying')}
 if(a==='dry'&&i.dry){i.clean+=i.dry;i.dry=0;toast(i.name+' → clean')}
 buzz();save();render();drawItem()}
/* washed sheet */
let W={};
function openWash(){W={};S.items.forEach(i=>W[i.id]=i.dirty);openSheet('<div id="wb"></div>');drawW()}
function drawW(){const d=S.items,dr=S.items.reduce((s,i)=>s+i.dry,0);
 document.getElementById('wb').innerHTML=`<h3>What did you wash?</h3><div class="sub muted">Takes dirty ones first, then clean</div>`+
 (d.length?grouped(d).map(([g,a])=>{const n=a.reduce((s,i)=>s+(W[i.id]||0),0);return ghead('w:'+g,g,`<span class="gs ${n?'w':'ok'}">${n?n+' to wash':'none'}</span>`)+'<div class="card">'+a.map(i=>`<div class="st"><span class="lb" style="flex-direction:column;align-items:flex-start;gap:0">${esc(i.name)}<span class="muted">${i.dirty} dirty · ${i.clean} clean</span></span><button class="rb" ${W[i.id]<=0?'disabled':''} onclick="wa('${i.id}',-1)">−</button><span class="v">${W[i.id]}</span><button class="rb" ${W[i.id]>=i.dirty+i.clean?'disabled':''} onclick="wa('${i.id}',1)">+</button></div>`).join('')+'</div>'}).join(''):'<p class="muted" style="text-align:center">Nothing dirty 🎉</p>')+
 `<div class="wfoot"><button class="p full" ${d.length?'':'disabled'} onclick="doWash()">Put in wash</button>
 <div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1" ${dr?'':'disabled'} onclick="allDry()">☀️ All dry (${dr})</button><button class="gh" style="flex:1" onclick="closeSheet()">Cancel</button></div></div>`}
function wa(id,d){const i=get(id);W[id]=Math.max(0,Math.min(i.dirty+i.clean,W[id]+d));buzz();const t=sh.scrollTop;drawW();sh.scrollTop=t}
function doWash(){let n=0;S.items.forEach(i=>{const k=Math.min(W[i.id]||0,i.dirty+i.clean),fd=Math.min(k,i.dirty);i.dirty-=fd;i.clean-=k-fd;i.dry+=k;n+=k});save();render();closeSheet();toast(n+' items in the wash')}
function allDry(){let n=0;S.items.forEach(i=>{n+=i.dry;i.clean+=i.dry;i.dry=0});save();render();closeSheet();toast(n?n+' items now clean':'Nothing drying')}
/* settings sheet: edits a draft, Save applies */
let D=[],confirmReset=false,menuK=-1,menuMode='',delK=-1;
function openSet(){D=S.items.map(i=>({id:i.id,name:i.name,qty:i.qty,group:i.group||'Other'}));confirmReset=false;menuK=-1;delK=-1;openSheet('<div id="sb"></div>');drawSet()}
function grab(){}
function drawSet(){const t=sh.scrollTop; const groups=GR.map(g=>[g,D.map((x,k)=>({x,k})).filter(o=>o.x.group===g)]).filter(([g,a])=>a.length);
 document.getElementById('sb').innerHTML=`<h3>Settings</h3><div class="sub muted">Tap a name to rename · ⋯ for more</div>`+
 groups.map(([g,a])=>`<div class="sgh">${esc(g)}</div><div class="scard">`+a.map(({x,k},j)=>`<div class="sr"><input class="sn" value="${esc(x.name)}" placeholder="Item name" oninput="D[${k}].name=this.value"><span class="ms"><button onclick="sq(${k},-1)" ${x.qty<=0?'disabled':''} aria-label="less">−</button><b>${x.qty}</b><button onclick="sq(${k},1)" aria-label="more">+</button></span><button class="ic${delK===k&&menuK!==k?' dx':''}" onclick="rdel(${k})" aria-label="delete">${delK===k&&menuK!==k?'Delete?':'🗑'}</button><button class="ic" onclick="om(${k})" aria-label="more options">⋯</button></div>`+(menuK===k?menu(k,j,a.length):'')).join('')+`<button class="sadd" onclick="addRow('${esc(g)}')">+ Add item</button></div>`).join('')+
 `<div class="sgh">Add to another group</div><div class="scard">${GR.filter(g=>!groups.some(x=>x[0]===g)).map(g=>`<button class="sadd" onclick="addRow('${esc(g)}')">+ ${esc(g)}</button>`).join('')||'<div class="sr muted">All groups in use</div>'}</div>
 <button class="dg full" style="margin:18px 0 10px" onclick="resetAll()">${confirmReset?'Tap again to mark everything clean':'Reset all clean'}</button>
 <div style="display:flex;gap:8px"><button class="gh" style="flex:1" onclick="closeSheet()">Cancel</button><button class="p" style="flex:2" onclick="saveSet()">Save</button></div>`;sh.scrollTop=t}
function menu(k,j,n){if(menuMode==='g')return `<div class="mn">${GR.map(g=>`<button onclick="chg(${k},'${esc(g)}')">${D[k].group===g?'✓ ':''}${esc(g)}</button>`).join('')}<button class="gh" onclick="menuMode='';drawSet()">Back</button></div>`;
 return `<div class="mn"><button ${j?'':'disabled'} onclick="mv(${k},-1)">↑ Move up</button><button ${j<n-1?'':'disabled'} onclick="mv(${k},1)">↓ Move down</button><button onclick="menuMode='g';drawSet()">Change group…</button><button class="del" onclick="del(${k})">${delK===k?'Tap again to delete':'Delete'}</button></div>`}
function rdel(k){menuK=-1;del(k)}
function om(k){menuK=menuK===k?-1:k;menuMode='';delK=-1;buzz();drawSet()}
function sq(k,d){D[k].qty=Math.max(0,(+D[k].qty||0)+d);buzz();drawSet()}
function chg(k,g){const x=D.splice(k,1)[0];x.group=g;D.push(x);menuK=-1;menuMode='';buzz();drawSet()}
function mv(k,d){let j=k+d;while(j>=0&&j<D.length&&D[j].group!==D[k].group)j+=d;if(j<0||j>=D.length)return;const t=D[k];D[k]=D[j];D[j]=t;menuK=j;buzz();drawSet()}
function del(k){if(delK!==k){delK=k;drawSet();return}D.splice(k,1);menuK=-1;delK=-1;drawSet()}
function addRow(g){D.push({id:'',name:'',qty:2,group:g});menuK=-1;drawSet();const k=D.length-1,ins=[...document.querySelectorAll('#sb input.sn')].find(e=>e.getAttribute('oninput')===`D[${k}].name=this.value`);ins&&ins.focus()}
function saveSet(){const out=[];D.forEach(x=>{const name=String(x.name).trim();if(!name)return;
 const qty=Math.max(0,parseInt(x.qty)||0);const grp=GR.includes(x.group)?x.group:'Other';
 let i=x.id&&get(x.id);
 if(i){i.name=name;let diff=qty-i.qty;i.qty=qty;
  if(diff>0)i.clean+=diff;else{diff=-diff;for(const k of['clean','dirty','dry']){const t=Math.min(i[k],diff);i[k]-=t;diff-=t}}}
 else i=mk([name,qty,0,0]);i.group=grp;out.push(i)});
 S.items=out;save();render();closeSheet();toast('Saved')}
function resetAll(){if(!confirmReset){confirmReset=true;drawSet();return}
 S.items.forEach(i=>{i.clean=i.qty;i.dirty=0;i.dry=0});save();render();closeSheet();toast('All clean')}
render();
</script></body></html>
